    theme_name: GLB/D1 Liquid Power Pool Aug`26
    required_settings:
      region: GLB
      delay: 1
      universe: TOPDIV3000
    excluded_datasets:
    - model110
    repair_signals: {}
    capture_prefixes:
    - HT_
    observe_only:
    - MATCHES_CLASSIFICATION
    - HT_TURNOVER
    - HT_HIGH_TURNOVER_RETURNS_RATIO
    valid_until: '2026-09-30'
